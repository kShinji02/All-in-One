# Publica legal-site/ no GitHub Pages.
# Pré-requisito: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Somente manual (Actions → "Publicar documentos legais" → Run workflow): os documentos
# ainda são rascunhos e não podem ser publicados automaticamente por um push.
name: Publicar documentos legais

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legal-site
      - id: deployment
        uses: actions/deploy-pages@v4
